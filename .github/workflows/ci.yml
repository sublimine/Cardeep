name: CI

# Bring-up smoke: proves a clean machine can install deps, import every bring-up
# entrypoint, build the schema from zero, and collect the test suite. This is the
# automated enforcement of docs/runbook/DEPLOY.md — exactly the sequence proven in a
# clean-room venv. It would have caught this repo's real deploy bugs (the missing
# apscheduler[sqlalchemy] + psycopg2-binary) and any migration drift, on every push.
#
# Scope note: the full behavioral suite runs against the developer's POPULATED cardeep-pg
# (millions of rows). On a fresh CI database many live tests would skip or lack data, so a
# blind `pytest` would go red for the wrong reason. We therefore run `--collect-only` here
# (catches every import/collection regression) and defer the data-dependent run to a future
# job seeded from a snapshot. Honest green over green-washing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bring-up-smoke:
    name: Bring-up smoke (install · import · migrate · collect)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cardeep
          POSTGRES_PASSWORD: cardeep_dev_only
          POSTGRES_DB: cardeep
        ports:
          - 5433:5432
        # -h 127.0.0.1 forces a TCP probe, so health only passes once the REAL server is
        # up (the initdb temp server is socket-only) — first line of defense vs the race.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cardeep -d cardeep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CARDEEP_DSN: postgres://cardeep:cardeep_dev_only@127.0.0.1:5433/cardeep
      CARDEEP_DB_URL: postgresql+psycopg2://cardeep:cardeep_dev_only@127.0.0.1:5433/cardeep

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (runtime + test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Import smoke — the 4 bring-up entrypoints
        run: python -c "import scripts.migrate, services.api.main, pipeline.ops.scheduler, pipeline.ops.silence_watchdog; print('IMPORTS OK')"

      - name: Recipe YAML lint (every countries/ES/**/recipe.yaml must parse — audit Q3)
        run: python scripts/fix_recipe_yaml.py --check

      - name: Wait for Postgres (host-side TCP — beats the initdb restart race)
        run: |
          for i in $(seq 1 40); do
            if python -c "import asyncio,asyncpg; asyncio.run(asyncpg.connect('${CARDEEP_DSN}', timeout=2))" 2>/dev/null; then
              echo "postgres reachable after ~${i}s"; exit 0
            fi
            sleep 1
          done
          echo "postgres never became reachable"; exit 1

      - name: Migrate up (build schema 0001→0040 from empty)
        run: python scripts/migrate.py up

      - name: Migrate verify (live schema == migrations, no drift)
        run: python scripts/migrate.py verify

      - name: Pytest collect (no import / collection errors)
        run: python -m pytest --collect-only -q

  db-tests:
    name: DB-backed tests (self-seeding suite · ephemeral migrated Postgres)
    runs-on: ubuntu-latest
    # Closes the "tests collect but never execute" gap for the DB-backed suite. The bring-up job only
    # --collect-only's and unit-tests runs the DB-free subset; this job RUNS every DB-backed test that
    # SEEDS ITS OWN DATA, against a fresh migrated EMPTY Postgres. Empirically 878 tests pass on an
    # empty DB (2026-06-23). The census-/network-dependent files live in tests/ci_local_only.txt (they
    # need the populated dev DB or live network) and stay in the local Ferrari run. So "CI green" now
    # covers the self-seeding suite, not just unit — honest green, still no green-washing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cardeep
          POSTGRES_PASSWORD: cardeep_dev_only
          POSTGRES_DB: cardeep
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cardeep -d cardeep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CARDEEP_DSN: postgres://cardeep:cardeep_dev_only@127.0.0.1:5433/cardeep
      CARDEEP_DB_URL: postgresql+psycopg2://cardeep:cardeep_dev_only@127.0.0.1:5433/cardeep
      CARDEEP_ASYNCPG_DSN: postgresql://cardeep:cardeep_dev_only@127.0.0.1:5433/cardeep
      CARDEEP_DSN_KW: host=127.0.0.1 port=5433 dbname=cardeep user=cardeep password=cardeep_dev_only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (runtime + test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Wait for Postgres (host-side TCP — beats the initdb restart race)
        run: |
          for i in $(seq 1 40); do
            if python -c "import asyncio,asyncpg; asyncio.run(asyncpg.connect('${CARDEEP_DSN}', timeout=2))" 2>/dev/null; then
              echo "postgres reachable after ~${i}s"; exit 0
            fi
            sleep 1
          done
          echo "postgres never became reachable"; exit 1

      - name: Migrate up (build schema from empty)
        run: python scripts/migrate.py up

      - name: Seed geo backbone (INE provinces+municipalities+centroids — in-repo data, zero network)
        # In-repo INE data (data/geo/*.xlsx/.csv, tracked); idempotent ON CONFLICT seeds. Unblocks the
        # geo-* tests (province/municipality/centroid lookups + entity_province_code FK) on the empty DB.
        run: |
          python -m scripts.load_geo
          python -m scripts.seed_geo_centroides

      - name: Seed CI census fixture (tiny synthetic dealers/vehicles — recovers census-dependent tests)
        # Idempotent, additive: a handful of active compraventa dealers in province 28 + available
        # vehicles, so census-reading tests (evict / muni-province / emit-gone / reconcile) can run.
        run: python -m scripts.seed_ci_fixture

      - name: Run the self-seeding DB-backed suite (excludes tests/ci_local_only.txt)
        run: |
          IGN=$(grep -vE '^#|^[[:space:]]*$' tests/ci_local_only.txt | sed 's#^#--ignore=#' | tr '\n' ' ')
          echo "Local-only files excluded from CI (need populated census / live network):"
          grep -vE '^#|^[[:space:]]*$' tests/ci_local_only.txt
          python -m pytest -m "not unit" $IGN -p no:cacheprovider -q

  frontend-build:
    name: Frontend build (web/ · typecheck + vite build)
    runs-on: ubuntu-latest
    # The web/ SPA must typecheck and build from a clean install on every push, so a
    # broken type or import in the frontend goes red here (not on a dev's machine).
    # tsc -b catches type regressions; vite build proves the production bundle compiles.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps (npm ci — lockfile-exact)
        working-directory: web
        run: npm ci

      - name: Typecheck + production build (tsc -b && vite build)
        working-directory: web
        run: npm run build

  secret-scan:
    name: Secret scan (gitleaks · OSS, zero-cost)
    runs-on: ubuntu-latest
    # No CARDEEP secret may ever land in the tree. gitleaks runs as the FREE OSS container
    # (the license only applies to the GitHub Action on org repos; the image is always free —
    # owner mandate: zero cost). .gitleaks.toml keeps the full upstream rule set (a real
    # AWS/GCP/private-key/prod-credential still fails) and allowlists ONLY audited third-party
    # PUBLIC keys + scan noise. Verified locally: clean tree -> 0 leaks; a planted real AWS key
    # -> caught. --no-git scans the checked-out tracked files.
    steps:
      - uses: actions/checkout@v4

      - name: gitleaks — fail on any new leak
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --no-git --config=/repo/.gitleaks.toml \
            --redact --no-banner --exit-code=1 -v

  unit-tests:
    name: Unit tests (pytest -m unit · DB-free)
    runs-on: ubuntu-latest
    # The bring-up job only `--collect-only`s (a fresh CI DB lacks the live data the integration
    # tests need). But the @pytest.mark.unit subset is pure — no DB, network or browser — and is
    # PROVEN DB-free (138 pass with a dead DSN). So it RUNS on every push here (no postgres service
    # on purpose), closing the "tests collect but never execute" gap for the pure subset. The
    # data-dependent run stays deferred to a future seeded-snapshot job (P13).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (runtime + test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the pure unit suite (no DB service — proves DB independence)
        run: python -m pytest -m unit -q

  country-proof-invariant:
    name: Country-proof invariant (cross-border isolation · BLOCKING gate)
    runs-on: ubuntu-latest
    # PROJECT 360-D — the mechanical blindaje that makes a cross-country regression IMPOSSIBLE.
    #
    # The country-isolation suite is a set of GOLDENS. Each test SEEDS synthetic two-country data
    # (ES + a second country that deliberately REUSES the same numeric province/municipality code
    # space — migrations/0053), runs the REAL identity/serving/geo code, asserts NO cross-border
    # merge/serve/leak, and ROLLS BACK (the dry-run stays byte-identical). They are the binding
    # guards of docs/generic-engine-bible/COUNTRY-PROOF-INVARIANT.md, plus the meta-guard
    # test_served_queries_have_country (statically FAILS the build the moment someone adds a served
    # census query with no country dimension).
    #
    # WHY A DEDICATED JOB ON HOST PORT 5434 (and NOT the shared db-tests :5433 service):
    #   These goldens HARD-REFUSE :5433 — `if "5433" in dsn: pytest.skip("live production")` — and
    #   also refuse to seed unless `entity` is EMPTY. Aimed at the db-tests :5433 DSN they ALL skip,
    #   so the invariant would NEVER actually execute in CI (a silent no-op gate). This job gives them
    #   their own ephemeral Postgres on host port 5434 + a freshly-migrated EMPTY census, so they RUN
    #   FOR REAL. DO NOT "consolidate" this onto :5433 and DO NOT add a census/geo seed step
    #   (seed_ci_fixture / load_geo): either change repopulates `entity` or trips the :5433 guard and
    #   silently turns every golden into a skip. The suite self-seeds its own geo + entities inside
    #   each rolled-back transaction; `migrate up` (schema to head) is the ONLY setup it needs.
    #
    # The final step FAILS the pipeline on any failure, error, SKIP, or if the suite shrinks below its
    # proven floor (134) — so the gate can never silently degrade into green-washing.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cardeep
          POSTGRES_PASSWORD: cardeep_dev_only
          POSTGRES_DB: cardeep
        ports:
          # Host 5434 mirrors the local dry-run (cardeep-pg-dryrun) and dodges the :5433 refuse-guard,
          # so the goldens execute instead of skipping. :5433 (live production) is never touched.
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cardeep -d cardeep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CARDEEP_DSN: postgres://cardeep:cardeep_dev_only@127.0.0.1:5434/cardeep
      CARDEEP_DB_URL: postgresql+psycopg2://cardeep:cardeep_dev_only@127.0.0.1:5434/cardeep

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (runtime + test — incl. anyascii translit + psycopg2)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Wait for Postgres (host-side TCP — beats the initdb restart race)
        run: |
          for i in $(seq 1 40); do
            if python -c "import asyncio,asyncpg; asyncio.run(asyncpg.connect('${CARDEEP_DSN}', timeout=2))" 2>/dev/null; then
              echo "postgres reachable after ~${i}s"; exit 0
            fi
            sleep 1
          done
          echo "postgres never became reachable"; exit 1

      - name: Migrate up (schema to head from empty — incl. 0053 dup-code coexistence, 0058 served country_code, 0059 wide geo codes)
        run: python scripts/migrate.py up

      - name: Run the country-isolation suite (goldens RUN here — :5434 + empty census, no skips)
        run: |
          python -m pytest -p no:cacheprovider -q --junit-xml=country-proof.xml \
            tests/test_country_isolation_dealer.py \
            tests/test_country_isolation_vehicle.py \
            tests/test_country_isolation_dedup.py \
            tests/test_country_isolation_overlay_dedup.py \
            tests/test_country_isolation_beta.py \
            tests/test_country_isolation_serving.py \
            tests/test_country_isolation_multicountry.py \
            tests/test_country_isolation_seal.py \
            tests/test_country_proof_guard.py \
            tests/test_cdp_check_multicountry.py \
            tests/test_served_queries_have_country.py \
            tests/test_geo_width_multicountry.py \
            tests/test_norm_name_translit.py \
            tests/test_analytic_province_width.py \
            tests/test_country_coexistence.py \
            tests/test_country_isolation_vin_xplatform.py \
            tests/test_g1_completion_multicountry.py \
            tests/test_g1_province_width.py \
            tests/test_comarca_trigger_country.py \
            tests/test_country_isolation_associations.py \
            tests/test_seed_centroides_country.py \
            tests/test_denominator_country.py

      - name: Assert the invariant actually executed (no silent all-skip, no shrink)
        # Anti-green-wash: pytest already fails the job on a real regression (failure/error → non-zero
        # exit). This adds the two cases pytest exits 0 on but that would make the gate a lie:
        # ANY skip (the goldens did not run → DSN/DB/census misconfigured) or a suite that shrank below
        # the proven floor of 164 tests (a golden file was deleted/emptied).
        run: |
          python -c "
          import xml.etree.ElementTree as ET, sys
          root = ET.parse('country-proof.xml').getroot()
          suites = root.findall('.//testsuite') or [root]
          tot = lambda k: sum(int(s.get(k, 0)) for s in suites)
          tests, failures, errors, skipped = tot('tests'), tot('failures'), tot('errors'), tot('skipped')
          print('country-proof gate -> tests=%d failures=%d errors=%d skipped=%d' % (tests, failures, errors, skipped))
          ok = failures == 0 and errors == 0 and skipped == 0 and tests >= 164
          print('PASS: cross-border isolation mechanically enforced' if ok else 'FAIL: regression, or goldens SKIPPED (silent no-op gate), or suite shrank below floor 164')
          sys.exit(0 if ok else 1)
          "
