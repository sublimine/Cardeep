name: CI

# Bring-up smoke: proves a clean machine can install deps, import every bring-up
# entrypoint, build the schema from zero, and collect the test suite. This is the
# automated enforcement of docs/runbook/DEPLOY.md — exactly the sequence proven in a
# clean-room venv. It would have caught this repo's real deploy bugs (the missing
# apscheduler[sqlalchemy] + psycopg2-binary) and any migration drift, on every push.
#
# Scope note: the full behavioral suite runs against the developer's POPULATED cardeep-pg
# (millions of rows). On a fresh CI database many live tests would skip or lack data, so a
# blind `pytest` would go red for the wrong reason. We therefore run `--collect-only` here
# (catches every import/collection regression) and defer the data-dependent run to a future
# job seeded from a snapshot. Honest green over green-washing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bring-up-smoke:
    name: Bring-up smoke (install · import · migrate · collect)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cardeep
          POSTGRES_PASSWORD: cardeep_dev_only
          POSTGRES_DB: cardeep
        ports:
          - 5433:5432
        # -h 127.0.0.1 forces a TCP probe, so health only passes once the REAL server is
        # up (the initdb temp server is socket-only) — first line of defense vs the race.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cardeep -d cardeep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CARDEEP_DSN: postgres://cardeep:cardeep_dev_only@127.0.0.1:5433/cardeep
      CARDEEP_DB_URL: postgresql+psycopg2://cardeep:cardeep_dev_only@127.0.0.1:5433/cardeep

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (runtime + test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Import smoke — the 4 bring-up entrypoints
        run: python -c "import scripts.migrate, services.api.main, pipeline.ops.scheduler, pipeline.ops.silence_watchdog; print('IMPORTS OK')"

      - name: Wait for Postgres (host-side TCP — beats the initdb restart race)
        run: |
          for i in $(seq 1 40); do
            if python -c "import asyncio,asyncpg; asyncio.run(asyncpg.connect('${CARDEEP_DSN}', timeout=2))" 2>/dev/null; then
              echo "postgres reachable after ~${i}s"; exit 0
            fi
            sleep 1
          done
          echo "postgres never became reachable"; exit 1

      - name: Migrate up (build schema 0001→0040 from empty)
        run: python scripts/migrate.py up

      - name: Migrate verify (live schema == migrations, no drift)
        run: python scripts/migrate.py verify

      - name: Pytest collect (no import / collection errors)
        run: python -m pytest --collect-only -q
