<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Hand-set wordmarks</title>
    <!--
      Twenty-five brands have no trustworthy vector logo in the public sources.
      A keyword search returns confidently wrong artwork for several of them —
      Bayer for BAIC, Barnes & Noble for Noble — which is far worse in a brand
      wall than plain type. So their names are set here in the site's own
      typeface and rendered to PNG: uniform, correct, and attributable to nobody
      but us.
    -->
    <link rel="stylesheet" href="/src/app/fonts.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #fff; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
      .wm { display: grid; place-items: center; width: 560px; height: 130px; background: #fff; }
      .wm span {
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 600;
        font-size: 72px;
        letter-spacing: -0.045em;
        color: #000;
        white-space: nowrap;
      }
      /* Long names get a touch more air so the wall stays optically even. */
      .wm.long span { font-size: 58px; letter-spacing: -0.03em; }
    </style>
  </head>
  <body>
    <div class="wm" data-slug="alpina"><span>ALPINA</span></div>
    <div class="wm" data-slug="bac"><span>BAC</span></div>
    <div class="wm" data-slug="baic"><span>BAIC</span></div>
    <div class="wm long" data-slug="de-tomaso"><span>De Tomaso</span></div>
    <div class="wm" data-slug="deepal"><span>DEEPAL</span></div>
    <div class="wm" data-slug="denza"><span>DENZA</span></div>
    <div class="wm" data-slug="gac"><span>GAC</span></div>
    <div class="wm" data-slug="gordon-murray"><span>GMA</span></div>
    <div class="wm" data-slug="holden"><span>HOLDEN</span></div>
    <div class="wm" data-slug="ineos"><span>INEOS</span></div>
    <div class="wm" data-slug="jac"><span>JAC</span></div>
    <div class="wm" data-slug="jaecoo"><span>JAECOO</span></div>
    <div class="wm" data-slug="jietu"><span>JETOUR</span></div>
    <div class="wm" data-slug="karma-automotive"><span>KARMA</span></div>
    <div class="wm long" data-slug="land-rover"><span>LAND ROVER</span></div>
    <div class="wm" data-slug="lotus"><span>LOTUS</span></div>
    <div class="wm long" data-slug="microlino"><span>Microlino</span></div>
    <div class="wm long" data-slug="mobilize"><span>Mobilize</span></div>
    <div class="wm" data-slug="neta"><span>NETA</span></div>
    <div class="wm" data-slug="noble"><span>NOBLE</span></div>
    <div class="wm" data-slug="omoda"><span>OMODA</span></div>
    <div class="wm long" data-slug="perodua"><span>PERODUA</span></div>
    <div class="wm long" data-slug="radical"><span>RADICAL</span></div>
    <div class="wm" data-slug="saturn"><span>SATURN</span></div>
    <div class="wm" data-slug="scion"><span>SCION</span></div>
  </body>
</html>
