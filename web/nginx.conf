# Cardeep frontend edge (inside the `web` Openship service container).
#
# Serves the built SPA and reverse-proxies the two API prefixes the frontend code
# already expects at same-origin, so the browser never needs CORS or the API's real
# domain:
#   - /api/v1/*  -> web/src/api/client.ts (auth, CRM, dealer_ops). Mirrors the
#                   existing Vite DEV proxy 1:1 (web/vite.config.ts) — same prefix
#                   strip, same target.
#   - /api/*     -> web/src/api/cardeep.ts (VITE_API_BASE=/api at build time).
# Both forward to the `api` Openship service on its internal service port (8090),
# reachable by service name on the Docker network (verified: Docker's embedded DNS
# at 127.0.0.11 — the same on any user-defined bridge network, which is what
# docker-compose-style orchestration, including Openship's compose-parser, creates).
#
# `resolver` + a variable in `proxy_pass` is REQUIRED, not cosmetic: nginx resolves a
# literal `proxy_pass http://api:8090;` hostname ONCE at config load. Verified live
# (2026-07-25, `docker run` this image standalone, no `api` container reachable):
# without this, nginx fails `host not found in upstream "api"` and refuses to start
# at all — one missing/restarting sibling container would take the entire frontend
# down. Routing through a variable forces per-request DNS resolution instead, so a
# still-starting or momentarily-restarted `api` degrades to a 502 on THAT request,
# not a dead `web` container.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set $api_upstream api:8090;

    location /api/v1/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — client-side routing (react-router-dom) owns everything else.
    location / {
        try_files $uri /index.html;
    }
}
