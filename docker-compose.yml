# Cardeep — local PostgreSQL backbone, reproducible bring-up.
#
# Faithfully reproduces the `cardeep-pg` container (postgres:16 on :5433) so any
# clean machine stands up an IDENTICAL database from the repo alone — the cold-start
# prerequisite for the whole system. See docs/runbook/DEPLOY.md for the A→Z sequence.
#
# Volume note: the named volume is declared with an explicit `name:` so this compose
# ADOPTS the existing live `cardeep_pg_data` volume on this host (zero data loss) and
# CREATES it fresh on a clean machine. Bring up with:  docker compose up -d cardeep-pg
#
# The dev password is local-only (bound to 127.0.0.1, never exposed) and matches the
# value already present across the committed codebase. It is env-overridable so a real
# deployment can inject a strong secret without editing this file.

services:
  cardeep-pg:
    image: postgres:16
    container_name: cardeep-pg
    environment:
      POSTGRES_USER: ${CARDEEP_DB_USER:-cardeep}
      POSTGRES_PASSWORD: ${CARDEEP_DB_PASSWORD:-cardeep_dev_only}
      POSTGRES_DB: ${CARDEEP_DB_NAME:-cardeep}
    ports:
      - "127.0.0.1:5433:5432"   # localhost-only — the DB is NEVER exposed publicly
    volumes:
      - cardeep_pg_data:/var/lib/postgresql/data
    restart: unless-stopped      # durable intent: "Cardeep no se cae"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CARDEEP_DB_USER:-cardeep} -d ${CARDEEP_DB_NAME:-cardeep}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Application services (autonomy-e2e Punto 3): API + autopilot daemon share one image ------
  # Both wait for a HEALTHY pg, carry the three DSN forms the code reads (psycopg2-keyword /
  # asyncpg-URL / SQLAlchemy-jobstore-URL), and restart-unless-stopped so the system stays up.
  api:
    build: .
    image: cardeep-app:latest
    container_name: cardeep-api
    command: ["uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8090"]
    environment: &app_env
      CARDEEP_DSN: "host=cardeep-pg port=5432 dbname=${CARDEEP_DB_NAME:-cardeep} user=${CARDEEP_DB_USER:-cardeep} password=${CARDEEP_DB_PASSWORD:-cardeep_dev_only}"
      CARDEEP_ASYNCPG_DSN: "postgresql://${CARDEEP_DB_USER:-cardeep}:${CARDEEP_DB_PASSWORD:-cardeep_dev_only}@cardeep-pg:5432/${CARDEEP_DB_NAME:-cardeep}"
      CARDEEP_DB_URL: "postgresql+psycopg2://${CARDEEP_DB_USER:-cardeep}:${CARDEEP_DB_PASSWORD:-cardeep_dev_only}@cardeep-pg:5432/${CARDEEP_DB_NAME:-cardeep}"
      # The autopilot daemon reaches the HOST's Ollama (a container's localhost is the container).
      CARDEEP_OLLAMA_URL: "${CARDEEP_OLLAMA_URL:-http://host.docker.internal:11434/api/generate}"
      CARDEEP_LLM_MODEL: "${CARDEEP_LLM_MODEL:-qwen2.5:7b}"
    ports:
      - "127.0.0.1:8090:8090"   # localhost-only, like the DB
    depends_on:
      cardeep-pg:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/health').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  autopilot:
    build: .
    image: cardeep-app:latest
    container_name: cardeep-autopilot
    command: ["python", "-m", "pipeline.ops.scheduler"]   # _start_scheduler: APScheduler daemon (the heartbeat)
    environment: *app_env
    depends_on:
      cardeep-pg:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cardeep_pg_data:
    name: cardeep_pg_data        # exact name → adopts the existing live volume, no prefix
