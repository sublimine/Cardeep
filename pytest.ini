[pytest]
# Registra los marcadores custom del proyecto para que pytest no emita
# PytestUnknownMarkWarning en cada run (la suite los usa sin registrar).
# No se fija asyncio_mode: se conserva el comportamiento por defecto (strict) que
# la suite ya usa (@pytest.mark.asyncio explicito o asyncio.run), sin cambios.
markers =
    unit: prueba unitaria pura (sin DB, sin red, sin browser)
    integration: toca la cardeep-pg viva en 127.0.0.1:5433 (auto-skip si no responde)
